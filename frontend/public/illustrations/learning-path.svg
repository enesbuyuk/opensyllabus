<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" fill="none" role="img" aria-label="A learning path across weeks, ending at a small robot">
  <defs>
    <linearGradient id="lp-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f27a1a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f27a1a"/>
    </linearGradient>
    <linearGradient id="lp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#131315"/>
    </linearGradient>
    <radialGradient id="lp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f27a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f27a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow behind the robot -->
  <circle cx="430" cy="120" r="110" fill="url(#lp-glow)"/>

  <!-- winding path through the weeks -->
  <path d="M30 250 C 110 250, 110 190, 190 190 S 270 130, 340 130 S 400 110, 410 112"
        stroke="url(#lp-path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- week milestones -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">
    <g transform="translate(30 250)">
      <circle r="15" fill="#5fd47e" fill-opacity="0.15" stroke="#5fd47e" stroke-width="2"/>
      <path d="M-6 0 l4 4 l8 -8" stroke="#5fd47e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="34" text-anchor="middle" fill="#9a9aa2">Week 1</text>
    </g>
    <g transform="translate(110 222)">
      <circle r="15" fill="#5fd47e" fill-opacity="0.15" stroke="#5fd47e" stroke-width="2"/>
      <path d="M-6 0 l4 4 l8 -8" stroke="#5fd47e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="34" text-anchor="middle" fill="#9a9aa2">Week 2</text>
    </g>
    <g transform="translate(190 190)">
      <circle r="15" fill="#5fd47e" fill-opacity="0.15" stroke="#5fd47e" stroke-width="2"/>
      <path d="M-6 0 l4 4 l8 -8" stroke="#5fd47e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="34" text-anchor="middle" fill="#9a9aa2">Week 3</text>
    </g>
    <g transform="translate(270 152)">
      <circle r="17" fill="#f27a1a"/>
      <circle r="24" stroke="#f27a1a" stroke-opacity="0.35" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#0a0a0b" font-size="12">4</text>
      <text y="40" text-anchor="middle" fill="#f2f2f3">Now</text>
    </g>
    <g transform="translate(340 130)">
      <circle r="13" fill="#131315" stroke="#3a3a40" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#9a9aa2" font-size="10">5</text>
    </g>
  </g>

  <!-- floating lesson card -->
  <g transform="translate(40 40)">
    <rect width="170" height="96" rx="14" fill="url(#lp-card)" stroke="#232327"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#2a1a0e"/>
    <path d="M22 22 h12 v12 h-12z M25 26 h6 M25 30 h4" stroke="#f27a1a" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="50" y="17" width="90" height="8" rx="4" fill="#f2f2f3" fill-opacity="0.85"/>
    <rect x="50" y="31" width="60" height="6" rx="3" fill="#9a9aa2" fill-opacity="0.6"/>
    <rect x="14" y="56" width="142" height="6" rx="3" fill="#232327"/>
    <rect x="14" y="56" width="98" height="6" rx="3" fill="#f27a1a"/>
    <rect x="14" y="72" width="54" height="12" rx="6" fill="#5fd47e" fill-opacity="0.15"/>
    <rect x="22" y="76" width="38" height="4" rx="2" fill="#5fd47e"/>
  </g>

  <!-- small rover robot at the end of the path -->
  <g transform="translate(395 50)">
    <!-- antenna -->
    <path d="M38 6 v14" stroke="#9a9aa2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="5" r="5" fill="#f27a1a"/>
    <!-- head -->
    <rect x="12" y="20" width="52" height="36" rx="12" fill="#1c1c20" stroke="#3a3a40" stroke-width="2"/>
    <circle cx="28" cy="38" r="6" fill="#f27a1a"/>
    <circle cx="48" cy="38" r="6" fill="#f27a1a"/>
    <circle cx="29.5" cy="36.5" r="2" fill="#fff" fill-opacity="0.8"/>
    <circle cx="49.5" cy="36.5" r="2" fill="#fff" fill-opacity="0.8"/>
    <!-- body -->
    <rect x="4" y="60" width="68" height="34" rx="10" fill="#131315" stroke="#3a3a40" stroke-width="2"/>
    <rect x="16" y="70" width="22" height="6" rx="3" fill="#5fd47e"/>
    <rect x="16" y="80" width="14" height="5" rx="2.5" fill="#9a9aa2" fill-opacity="0.6"/>
    <circle cx="56" cy="77" r="7" stroke="#f27a1a" stroke-width="2.5"/>
    <!-- wheels -->
    <circle cx="16" cy="100" r="10" fill="#0e0e10" stroke="#3a3a40" stroke-width="3"/>
    <circle cx="60" cy="100" r="10" fill="#0e0e10" stroke="#3a3a40" stroke-width="3"/>
    <circle cx="16" cy="100" r="3" fill="#9a9aa2"/>
    <circle cx="60" cy="100" r="3" fill="#9a9aa2"/>
    <!-- sensor beam -->
    <path d="M74 70 l34 -12 v26z" fill="#f27a1a" fill-opacity="0.18"/>
  </g>

  <!-- sparkles -->
  <g fill="#f27a1a">
    <path d="M250 60 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill-opacity="0.8"/>
    <path d="M480 220 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill-opacity="0.6"/>
    <circle cx="300" cy="250" r="3" fill-opacity="0.5"/>
    <circle cx="470" cy="40" r="2.5" fill-opacity="0.6"/>
  </g>
</svg>
